<!-- Supabase → Authentication → Emails → Templates → "Magic link"
     Subject: Your Bebig sign-in link -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#F8F5FB; padding:32px 16px; color:#2E2A3B">
  <div style="max-width:480px; margin:0 auto; background:#FFFFFF; border-radius:20px; padding:32px 28px; border:1px solid #EDE8F4">
    <h1 style="margin:0 0 12px; font-size:22px; color:#2E2A3B">Sign in to Bebig</h1>
    <p style="margin:0 0 20px; font-size:15px; line-height:1.5; color:#4C475A">Tap below to sign in to Bebig as <strong>{{ .Email }}</strong>. The link works once and expires soon.</p>
    <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email" style="display:inline-block; background:#6A5BAE; color:#FFFFFF; text-decoration:none; font-weight:700; padding:13px 26px; border-radius:999px; font-size:15px">Sign in</a></p>
    <p style="margin:0 0 6px; font-size:13px; color:#6B6579">Or copy this link into your browser:</p>
    <p style="margin:0 0 24px; font-size:13px; word-break:break-all; color:#6A5BAE">{{ .SiteURL }}/?token_hash={{ .TokenHash }}&type=email</p>
    <p style="margin:0; font-size:12px; color:#6B6579">If you didn’t ask to sign in, you can ignore this email.</p>
  </div>
  <p style="text-align:center; font-size:12px; color:#6B6579; margin:16px 0 0">Bebig · bebig.app</p>
</div>
