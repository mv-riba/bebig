<!-- Supabase → Authentication → Emails → Templates → "Reauthentication"
     Subject: Your Bebig confirmation code -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#F8F5FB; padding:32px 16px; color:#2E2A3B">
  <div style="max-width:480px; margin:0 auto; background:#FFFFFF; border-radius:20px; padding:32px 28px; border:1px solid #EDE8F4">
    <h1 style="margin:0 0 12px; font-size:22px; color:#2E2A3B">Confirm it’s you</h1>
    <p style="margin:0 0 20px; font-size:15px; line-height:1.5; color:#4C475A">Enter this code in Bebig to continue:</p>
    <p style="margin:0 0 24px; font-size:28px; font-weight:700; letter-spacing:6px; color:#6A5BAE">{{ .Token }}</p>
    <p style="margin:0; font-size:12px; color:#6B6579">If you didn’t ask for this, you can ignore this email.</p>
  </div>
  <p style="text-align:center; font-size:12px; color:#6B6579; margin:16px 0 0">Bebig · bebig.app</p>
</div>
