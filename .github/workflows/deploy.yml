name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs (a moved tag can't change what runs); Dependabot proposes updates.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      # reported on every PR; not blocking yet (the codebase has never been type-checked in CI)
      - run: npm run typecheck
        continue-on-error: true
      - run: npm run build
        env:
          BEBIG_SUPABASE_URL: ${{ vars.BEBIG_SUPABASE_URL }}
          BEBIG_SUPABASE_ANON_KEY: ${{ vars.BEBIG_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
